<!DOCTYPE html>
<html lang = 'en'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel = 'stylesheet' href = 'style.css'>
    <title>Pay</title>
</head>
<body>
    <main class = 'container'>
        <div class = 'navbar'>
            <div class = 'logo'><i class="fa-solid fa-book"></i><span>My Bookshop</span></div>
            <div class = "hamburger" id= 'menu'>
                <i class="fa-solid fa-bars"></i>
            </div>
            <nav>
                <ul class = 'nav-links'>
                    <li><a href = 'index.html'>Home</a></li>
                    <li><a href = '#'>About Us</a></li>
                    <li><a href = '#'>Contact Us</a></li>
                </ul>
            </nav>
        </div>
       <section class="payment">
    <h2>Payment Options</h2>
    <hr>
<div class="payment-method">
    <h1 class="payment-title">Debit / Credit Card</h1>
    <div class="payment-icons">
        <i class="fa-brands fa-cc-mastercard"></i>
        <i class="fa-brands fa-cc-visa"></i>
        <i class="fa-brands fa-cc-amex"></i>
        <i class="fa-brands fa-cc-paypal"></i>
    </div>
</div>
    <form class="payment-form" id = 'payment-form'>
        <label for="card-number">Card Number</label>
        <input type="text" id="card-number" placeholder="1234 5678 9012 3456" required>
       <div class="form-row">
    <div class="form-group">
        <label for="exp-month">Expiry Month</label>
        <select id="exp-month" name="exp-month" required>
            <option value="" disabled selected>Month</option>
            <option value="01">01 - January</option>
            <option value="02">02 - February</option>
            <option value="03">03 - March</option>
            <option value="04">04 - April</option>
            <option value="05">05 - May</option>
            <option value="06">06 - June</option>
            <option value="07">07 - July</option>
            <option value="08">08 - August</option>
            <option value="09">09 - September</option>
            <option value="10">10 - October</option>
            <option value="11">11 - November</option>
            <option value="12">12 - December</option>
        </select>
    </div>

    <div class="form-group">
        <label for="exp-year">Expiry Year</label>
        <select id="exp-year" name="exp-year" required>
            <option value="" disabled selected>Year</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
            <option value="2029">2029</option>
            <option value="2030">2030</option>
            <option value="2031">2031</option>
            <option value="2032">2032</option>
            <option value="2033">2033</option>
            <option value="2034">2034</option>
            <option value="2035">2035</option>
        </select>
    </div>
</div>
        <label for="cvv">Security Code</label>
        <input type="text" id="cvv" placeholder="123" required>
        <small>(3–4 digit code normally on the back of your card)</small>

        <button type="submit" class="continue-btn">Continue</button>
        <p id="message"></p>
    </form>
</section>
    </main>
    <script src = 'script.js'></script>
</body>
</html>
